# Mechanical backstop for the `human-gate` label, as a reusable workflow.
#
# A human-gated PR may be opened by an agent, but merging it is a call only the
# repo owner can make — it carries a stake he alone can weigh, or a step only he
# can take — so auto-merge must never carry it in, and the PR body must say so
# where the owner will read it.
#
# Two jobs, both short-circuiting on the label:
#   enforce  disables auto-merge on any PR carrying `human-gate`.
#   body     fails the run, once per PR, when the body does not tell the owner
#            the merge is theirs and what is at stake in it.
#
# Callers pass their own runner labels; everything else is identical everywhere,
# which is the point of this file. See README.md for the caller snippet.
#
# Security invariants, both load-bearing:
#   * No `${{ }}` interpolation inside any `run:` script. Every value a caller or
#     an event supplies reaches the shell through `env:`, so PR text can never be
#     spliced into the script (GitHub script injection).
#   * Only the built-in GITHUB_TOKEN and `gh`. No third-party actions, and no
#     checkout — the PR's own code is never fetched or run by this workflow.
#
# Permissions: a reusable workflow cannot raise the caller's GITHUB_TOKEN
# permissions, only narrow them. The caller must therefore grant
# `contents: read` and `pull-requests: write` itself; without them the `gh`
# calls below fail with 403 and the run goes red rather than passing quietly.
name: Human gate

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label(s) as a JSON string: '"ubuntu-latest"' or
          '["self-hosted","Linux","X64"]'. Required on purpose — a default here
          would silently land a caller on billed GitHub-hosted minutes.
        required: true
        type: string
      owner-note:
        description: >-
          One extra sentence appended to the auto-merge comment, for a repo
          where the owner's step is worth naming (e.g. flashing hardware).
        required: false
        default: ''
        type: string
      require-body-statement:
        description: >-
          Run the `body` job. Leave true: disabling it removes the only thing
          that tells the owner, in the PR he is reading, that the merge is his.
        required: false
        default: true
        type: boolean

jobs:
  enforce:
    name: Disable auto-merge on human-gated PRs
    # Cheap short-circuit: only bother when the label is present on the PR.
    if: contains(github.event.pull_request.labels.*.name, 'human-gate')
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - name: Disable auto-merge if enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          OWNER_NOTE: ${{ inputs.owner-note }}
        run: |
          set -euo pipefail
          # Re-check auto-merge state at runtime (the labeled event can fire
          # when auto-merge is off — exit quietly in that case).
          auto_merge=$(gh pr view "$PR_URL" --json autoMergeRequest \
            --jq '.autoMergeRequest')
          if [ "$auto_merge" = "null" ] || [ -z "$auto_merge" ]; then
            echo "Auto-merge is not enabled; nothing to do."
            exit 0
          fi

          echo "Auto-merge is enabled on a human-gated PR; disabling it."
          gh pr merge "$PR_URL" --disable-auto

          # Comment only when this run actually disabled auto-merge, so a PR
          # that never had it re-enabled is not commented on twice.
          comment="This PR carries the \`human-gate\` label: merging it is a call only the repo owner can make — the stake is stated in the PR body — so auto-merge was disabled automatically. Re-enabling it will just be disabled again."
          # The caller's extra sentence, if any. Appended rather than spliced in,
          # so the shared half of the message is identical in every repo.
          if [ -n "$OWNER_NOTE" ]; then
            comment="$comment $OWNER_NOTE"
          fi
          gh pr comment "$PR_URL" --body "$comment"

  body:
    name: PR body must say the merge is the owner's, and what is at stake
    # Disabling auto-merge is invisible to whoever reads the PR. A body still
    # saying "Nothing to do — merges itself when checks pass" therefore tells
    # the owner the opposite of the truth, and the PR parks forever with nobody
    # knowing the merge is theirs. This job makes that mechanically impossible
    # to miss: it never edits the body, it comments once and fails the run.
    #
    # It also requires the line to name the stake. `human-gate` exists only for
    # a merge the owner can actually evaluate (money, a risk he would weigh,
    # visible behavior, a step only he can take); "your call" with nothing after
    # it is a request to rubber-stamp, and work that risky but unevaluable
    # merges on an independent adversarial review instead.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'human-gate')
      && inputs.require-body-statement
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - name: Require the owner-merge statement in the PR body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          # Dedup key for the comment, the canonical line agents write, and the
          # stake pattern. This workflow is the single source of all three;
          # agent-loops' scripts/lib-human-gate.sh carries the same values for
          # the sweep that runs outside CI, and its test suite pins them equal.
          marker='<!-- agent-loops:human-gate-body-check -->'
          # The single quotes are required, not a mistake: the backticks in the
          # line are literal markdown that must reach the PR comment unexpanded,
          # and double quotes would run them as command substitution. That is the
          # bug this directive is silencing shellcheck's guess about, not hiding.
          # shellcheck disable=SC2016
          canonical='> ⚠️ **`human-gate`: merging this is your call** — <the stake in one line: what it costs, the risk you are accepting, or the step only you can take>.'
          stake='(your call|yours|your merge|you merge).*(—|–|--|[[:space:]]-[[:space:]]|:)[[:space:]]*[^[:space:]].{19,}'

          body=$(gh pr view "$PR_URL" --json body --jq '.body // ""')

          # A statement = ONE line that is a blockquote, names the label, and
          # says both that the merge belongs to the reader and what is at stake
          # in it. Chained greps keep all three conditions on the same line; the
          # phrasing alternation is wider than the canonical string so
          # hand-written variants that tell the same truth pass. A line stopping
          # at "your call" does not: it asks for an approval with nothing to
          # judge by.
          if printf '%s\n' "$body" \
            | grep -E '^[[:space:]]*>' \
            | grep -F 'human-gate' \
            | grep -qiE "$stake"; then
            echo "PR body states the merge is the owner's and what is at stake; nothing to do."
            exit 0
          fi

          # Comment once per PR, then fail loudly. Never rewrite the body: that
          # would hide the defect instead of reporting it.
          if gh pr view "$PR_URL" --json comments --jq '.comments[].body' \
            | grep -qF "$marker"; then
            echo "Already commented on this PR; failing again without a duplicate comment."
          else
            # Same as above: the ``` fence in the format string is literal
            # markdown, so the format must stay single-quoted.
            # shellcheck disable=SC2016
            gh pr comment "$PR_URL" --body "$(printf '%s\n%s\n\n%s\n\n%s\n\n```\n%s\n```\n' \
              "$marker" \
              "This PR carries the \`human-gate\` label, so **auto-merge is disabled and merging it is the repo owner's call** — but the PR body never says so." \
              "The line must also name **what is at stake** in that call: what it costs, the risk being accepted in real-world terms, or the step only the owner can take. If there is no such stake, the gate does not belong on this PR — get an independent adversarial review instead and merge on a clean verdict." \
              "Add the owner-merge statement to the top of the \`**For you:**\` section:" \
              "$canonical")"
          fi

          # ::error:: is read from stdout by the runner, not stderr.
          echo "::error::human-gate PR body does not tell the owner the merge is theirs and what is at stake in it."
          echo "Add this line to the PR body:"
          echo "$canonical"
          exit 1
