# Tier 3: a change to the things that decide whether other changes are correct
# cannot be judged by those same things.
#
# The September 2026 CI week was almost entirely this class. A parallelisation
# of the Playwright config merged on its own green run and took the workstation
# down for a day; a framing brief shrank a 3D plate to a quarter of its depth
# and passed the pixel test it had just rewritten; a sudoers policy that gave CI
# root on a shared machine was imported into infra because it was already there.
# Every one of them was a change to a judge, merged by that judge.
#
# So Tier 3 paths — CI workflows, test and Playwright configuration, time
# budgets, screenshot baselines, sudoers, runner tables, release plumbing,
# CODEOWNERS — require the `human-gate` label, and the owner's own workflow then
# holds the PR open for him. This workflow asserts one implication and no more:
# touching Tier 3 implies the label. It never re-asserts what `human-gate.yml`
# owns (the stake line, disabling auto-merge), so two checks can never disagree
# about one label.
#
# Design constraints, each load-bearing:
#   * It must REPORT ON EVERY PR. A required check whose workflow never starts
#     leaves its context pending forever and freezes the repository, so there is
#     no `paths:` filter anywhere: the file list is computed here, and the job
#     passes fast when nothing matches.
#   * The caller must trigger it with `pull_request_target`, not
#     `pull_request`. Under `pull_request` GitHub runs the workflow file from
#     the PR's merge ref, so a PR that edited its own caller — and
#     `.github/workflows/**` is itself Tier 3 — would be judged by its own edit.
#     `pull_request_target` runs the base branch's copy. That is safe here for
#     the same reason the rest of this repository is: nothing is checked out and
#     no PR code is executed, only `gh` reads.
#   * `.github/**` is ALWAYS Tier 3, whatever a caller passes, so a repository
#     cannot declare its own guard out of scope.
#   * No `${{ }}` inside `run:`. Every value reaches the shell through `env:`.
#
# Permissions: a reusable workflow can only narrow the caller's token. The
# caller grants `contents: read` and `pull-requests: read`, and must set them
# explicitly, because under `pull_request_target` the default token is a write
# token.
#
# What this does NOT do, stated plainly because the alternative is a false sense
# of safety: agents here act with the owner's own GitHub identity, so an agent
# can add the label and merge. This stops the accidental and the automated paths
# — auto-merge, the self-merge sweep — and makes the requirement loud and
# visible. It does not distinguish the owner from an agent holding his token.
name: Tier 3 gate

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label(s) as a JSON string: '"ubuntu-latest"' or
          '["self-hosted","Linux","X64"]'. Required on purpose — a default here
          would silently land a caller on billed GitHub-hosted minutes.
        required: true
        type: string
      paths:
        description: >-
          This repository's Tier 3 paths, one glob per line. `**` matches across
          directories. `.github/**` is always included and need not be listed.
        required: true
        type: string
      label:
        description: >-
          The label that means "a human merges this". Change it only for a
          repository whose owner uses a different word for the same thing.
        required: false
        default: human-gate
        type: string

jobs:
  gate:
    # This name is half of the required-check context (`<caller job id> / gate`)
    # and is therefore a public interface: renaming it silently un-requires the
    # check in every ruleset that names it. tests/test_tier3_gate.py pins it.
    name: gate
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - name: Tier 3 paths require the human-gate label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABEL: ${{ inputs.label }}
          # Evaluated by Actions, not by the shell: the label set comes from the
          # event payload, and the caller's `labeled`/`unlabeled` types re-run
          # the workflow so the context is re-evaluated when it is added.
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, inputs.label) }}
          CALLER_PATHS: ${{ inputs.paths }}
        run: |
          set -euo pipefail

          if [ "$HAS_LABEL" = "true" ]; then
            echo "This PR carries the $LABEL label: the owner merges it. Nothing to check."
            exit 0
          fi

          # Tier 3 in every repository, whatever the caller passed: the callers
          # themselves, CODEOWNERS, and every other workflow. A PR must not be
          # able to widen its own scope.
          always='.github/**'

          # `**` is written for humans; `case` globs already cross `/`, so the
          # two mean the same thing once the extra star is gone.
          patterns=$(printf '%s\n%s\n' "$always" "$CALLER_PATHS" \
            | sed 's/\*\*/*/g' | grep -v '^[[:space:]]*$' || true)

          # `--paginate` stops at the API's own cap of 3000 files. A truncated
          # list cannot prove the absence of a Tier 3 file, so a capped list
          # counts as touching one: the gate fails closed and the label is the
          # way through.
          files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[].filename')
          count=$(printf '%s\n' "$files" | grep -c . || true)

          matched=''
          if [ "$count" -ge 3000 ]; then
            matched='(the file list hit the API cap of 3000 files, so this PR counts as touching Tier 3)'
          else
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              while IFS= read -r pattern; do
                [ -n "$pattern" ] || continue
                # shellcheck disable=SC2254  # $pattern is a glob on purpose
                case "$file" in
                  $pattern) matched="$matched$file"$'\n'; break ;;
                esac
              done <<< "$patterns"
            done <<< "$files"
          fi

          if [ -z "$matched" ]; then
            echo "No Tier 3 path among this PR's $count changed file(s)."
            exit 0
          fi

          echo "Tier 3 paths changed without the $LABEL label:"
          printf '%s' "$matched" | head -20
          total=$(printf '%s' "$matched" | grep -c . || true)
          if [ "$total" -gt 20 ]; then
            echo "  ... and $((total - 20)) more"
          fi
          echo
          echo "These files decide whether other changes are correct, so a human merges this one."
          echo "Add the $LABEL label and the owner-merge line to the PR body (human-gate's comment"
          echo "carries the exact text); auto-merge is then disabled and the owner merges it."
          exit 1
