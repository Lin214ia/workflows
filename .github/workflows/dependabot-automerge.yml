# Enables GitHub's native auto-merge for Dependabot PRs, so patch/minor bumps
# land themselves once CI is green, shared across every caller repo. This
# generalises the workflow that lived only in AyakaRadiology/needle-simulator
# (`.github/workflows/dependabot-automerge.yml` there, now a thin caller of
# this file) so every repo running Dependabot gets the same policy instead of
# five copies quietly drifting apart (see README.md).
#
# Direction (Harry, 2026-09-27 chat): patch/minor auto-merges; majors are left
# for an agent to review weekly; roll out repo-wide.
#
# Arming rule: auto-merge is armed for semver patch or minor updates in ANY
# ecosystem. `dependabot/fetch-metadata`'s `update-type` output is documented as
# "the highest semver change being made by this PR", so a grouped PR (multiple
# dependencies bundled by `.github/dependabot.yml` `groups:`) is already the
# worst-case update type across the group -- a major bump anywhere in the group
# reports major and the PR is left unarmed, no per-dependency parsing needed.
#
# `hold-patterns` lets a caller exempt specific dependencies from ALL of the
# above regardless of update-type (e.g. needle-simulator's Cornerstone3D
# render stack, which has broken the desktop app in ways CI does not catch;
# scl3300-stream's pico-sdk submodule, which its own dependabot.yml documents
# as "not an auto-merge candidate"). A held dependency never arms and gets a
# one-time review comment instead.
#
# Major updates never arm by default (`arm-majors: false`): they get a
# one-time PR comment flagging them for an agent (or Harry) to review, plus the
# `dependabot-major` label (created idempotently). Setting `arm-majors: true`
# is a separate, deliberate decision a caller must opt into explicitly -- do
# not flip it without an owner decision; majors stay labelled either way.
#
# Uses `pull_request_target` but deliberately does NOT check out or run any PR
# code -- it only reads trusted Dependabot metadata and calls `gh` -- so the
# elevated token is not exposed to untrusted code.
#
# Merge identity: `gh pr merge --auto` is run with a short-lived GitHub App
# installation token, NOT the caller's GITHUB_TOKEN. GitHub attributes the
# eventual auto-merge to whoever armed it, and a merge made with GITHUB_TOKEN
# deliberately fires no `push` workflows (loop prevention) -- so Dependabot
# merges never ran post-merge CI on main nor release-please (2026-10-01,
# needle-simulator #1272/#1273). Merged by an App, the `push` events fire like
# any other merge. Callers pass the App credentials as the optional `app-id`
# and `app-private-key` secrets. Because this job runs under
# pull_request_target from dependabot[bot], `secrets.*` in the caller resolves
# against the DEPENDABOT secret store, so the credentials must exist there
# (`gh secret set --app dependabot ...`), not only as Actions secrets.
# Without credentials the job falls back to GITHUB_TOKEN with an explicit
# ::warning: failing instead would stop all auto-merge the moment this lands,
# before any repo has the secrets, which is a worse regression than today's
# behaviour; the warning names what is lost. The token is minted only after
# the gate decided to arm, scoped to the current repository and to
# contents/pull-requests write, and used for that one `gh` call; the other
# steps keep GITHUB_TOKEN. No PR code is ever checked out.
#
# Permissions: a reusable workflow cannot raise the caller's GITHUB_TOKEN
# permissions, only narrow them. The caller must grant `contents: write` (auto
# -merge + labels) and `pull-requests: write` (comments) itself; without them
# the `gh` calls below fail with 403 and the run goes red rather than passing
# quietly.
name: Dependabot auto-merge

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label(s) as a JSON string: '"ubuntu-latest"' or
          '["self-hosted","Linux","X64"]'. Defaults to GitHub-hosted
          `ubuntu-latest`: some caller repos have no self-hosted runner group at all,
          and this job does not check out or build anything, so hosted minutes
          for it are cheap. A caller with its own runner group should still
          pass it explicitly, for the same reason its other CI jobs do.
        required: false
        default: '"ubuntu-latest"'
        type: string
      hold-patterns:
        description: >-
          Comma-separated dependency-name glob patterns (matched against
          fetch-metadata's `dependency-names` with bash `case`, e.g.
          "@cornerstonejs/*,pico-sdk"). Any dependency in the PR matching one
          of these is never armed, regardless of update-type, and gets a
          one-time review comment instead. Empty (default) holds nothing.
        required: false
        default: ''
        type: string
      arm-majors:
        description: >-
          When true, major-version updates are armed for auto-merge the same
          as patch/minor (still labelled `dependabot-major`). Default false:
          majors are left for an agent to review instead. This is a separate
          decision from adopting this workflow -- do not set true without an
          explicit owner decision.
        required: false
        default: false
        type: boolean
    secrets:
      app-id:
        description: >-
          Id of the GitHub App whose installation token arms auto-merge, so
          the merge is attributed to the App and fires `push` workflows. Must
          be a Dependabot secret in the caller (see header). Optional only so
          rollout can precede provisioning; absent means a loud warning and a
          GITHUB_TOKEN fallback.
        required: false
      app-private-key:
        description: Private key (PEM) of the App named by `app-id`.
        required: false

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    # Measured 15-22 s (needle-simulator, 4 non-skipped runs); 5 min is the floor.
    timeout-minutes: 5
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Classify update (patch/minor vs major, hold-patterns)
        id: gate
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEP_NAMES: ${{ steps.meta.outputs.dependency-names }}
          HOLD_PATTERNS: ${{ inputs.hold-patterns }}
          ARM_MAJORS: ${{ inputs.arm-majors }}
        run: |
          set -euo pipefail
          echo "update-type=$UPDATE_TYPE  dependency-names=$DEP_NAMES  hold-patterns=$HOLD_PATTERNS"

          held=false
          IFS=',' read -ra patterns <<< "$HOLD_PATTERNS"
          IFS=',' read -ra deps <<< "$DEP_NAMES"
          for pattern in "${patterns[@]}"; do
            [ -z "$pattern" ] && continue
            for dep in "${deps[@]}"; do
              # shellcheck disable=SC2254  # $pattern is a glob on purpose
              case "$dep" in
                $pattern) held=true ;;
              esac
            done
          done

          major=false
          case "$UPDATE_TYPE" in
            version-update:semver-major) major=true ;;
          esac

          auto=false
          if [ "$held" = "false" ]; then
            if [ "$major" = "false" ]; then
              auto=true
            elif [ "$ARM_MAJORS" = "true" ]; then
              auto=true
            fi
          fi

          {
            echo "held=$held"
            echo "major=$major"
            echo "auto=$auto"
          } >> "$GITHUB_OUTPUT"
          echo "Decision: held=$held major=$major auto=$auto"

      - name: Check App credentials for the merge identity
        id: creds
        if: steps.gate.outputs.auto == 'true'
        env:
          APP_ID: ${{ secrets.app-id }}
          APP_PRIVATE_KEY: ${{ secrets.app-private-key }}
        run: |
          set -euo pipefail
          if [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Auto-merge will use GITHUB_TOKEN::No App credentials reached this job (app-id/app-private-key are empty; for a Dependabot-triggered run they must be DEPENDABOT secrets). The merge will be attributed to github-actions and will NOT trigger push workflows: no post-merge CI on main, no release-please."
          fi

      - name: Mint the App token that arms auto-merge
        id: app-token
        if: steps.gate.outputs.auto == 'true' && steps.creds.outputs.available == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write

      - name: Enable auto-merge for patch/minor PR
        if: steps.gate.outputs.auto == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Ensure the dependabot-major label exists
        if: steps.gate.outputs.major == 'true' && steps.gate.outputs.held == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create dependabot-major --repo "$REPO" \
            --color 5319e7 \
            --description "Major dependency bump left for an agent to review" \
            --force

      - name: Apply the dependabot-major label
        if: steps.gate.outputs.major == 'true' && steps.gate.outputs.held == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-label dependabot-major

      - name: Flag major update for review (comment once)
        if: steps.gate.outputs.major == 'true' && steps.gate.outputs.held == 'false' && steps.gate.outputs.auto == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          marker="major update: left for an agent to review"
          already="$(gh pr view "$PR_URL" --json comments -q '.comments[].body' | grep -qF "$marker" && echo yes || echo no)"
          if [ "$already" = "yes" ]; then
            echo "already flagged, skipping comment"
          else
            gh pr comment "$PR_URL" --body "$marker"
          fi

      - name: Flag held dependency update for review (comment once)
        if: steps.gate.outputs.held == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          marker="held dependency update: left for an agent to review with evidence"
          already="$(gh pr view "$PR_URL" --json comments -q '.comments[].body' | grep -qF "$marker" && echo yes || echo no)"
          if [ "$already" = "yes" ]; then
            echo "already flagged, skipping comment"
          else
            gh pr comment "$PR_URL" --body "$marker"
          fi
